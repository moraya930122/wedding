<style>
/* Layout: one 460px column on warm linen; photo bands bleed to the column edge, text sections breathe in between.
   Single-theme by choice (a printed-card look), so no dark palette. */
:root {
  --linen: #FAF7F2;      /* page */
  --sand: #F1EBE2;       /* banded sections */
  --oat: #E6DDD0;        /* photo placeholder, lines */
  --ink: #3E3833;        /* names, headings */
  --text: #6A625A;       /* body */
  --mute: #A89E93;       /* labels, off-month days */
  --taupe: #6E6156;      /* wedding-day dot, buttons */
  --paper: #FFFFFF;
  --sans: "Noto Sans KR", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --script: "Cormorant Garamond", "Times New Roman", serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--sand); color: var(--text); font-family: var(--sans); font-weight: 400; font-size: 15px; line-height: 1.75; -webkit-font-smoothing: antialiased; word-break: keep-all; }
.card { max-width: 460px; margin: 0 auto; background: var(--linen); overflow: hidden; }
.pad { padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
section { padding-block: 64px; }
.eyebrow { font-family: var(--script); font-style: italic; font-size: 17px; color: var(--mute); letter-spacing: .02em; text-align: center; margin: 0 0 4px; }
h2 { font-size: 18px; font-weight: 600; color: var(--ink); text-align: center; margin: 0 0 28px; text-wrap: balance; }
.rule { width: 44px; height: 1px; background: var(--oat); margin: 32px auto; border: 0; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--taupe); outline-offset: 3px; }

/* Photo placeholders: linen-toned frames until real photos arrive */
.ph { position: relative; background: linear-gradient(160deg, #EFE7DB, #E3D8C8); display: grid; place-items: center; max-width: 100%; }
.ph::after { content: attr(data-label); font-size: 12px; letter-spacing: .08em; color: #A0907E; }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ph.has-img::after { content: none; }

/* Cover */
.cover { position: relative; }
.cover .ph { aspect-ratio: 2 / 3; width: 100%; }
.cover .ph img { object-position: center 70%; }
.cover-text { text-align: center; padding-block: 44px 28px; }
.cover-text .eyebrow { color: #8E8276; }
.cover-names { font-size: 22px; font-weight: 600; color: var(--ink); letter-spacing: .04em; margin: 0; }
.sample { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 1; font-size: 11px; color: var(--text); background: rgba(250,247,242,.85); border-radius: 99px; padding: 3px 12px; white-space: nowrap; }

/* Date / venue line */
.facts { padding-block: 32px 8px; display: grid; gap: 6px; }
.fact { display: flex; justify-content: space-between; gap: 16px; }
.fact dt { color: var(--mute); }
.fact dd { margin: 0; color: var(--ink); font-weight: 500; text-align: right; min-width: 0; }

/* Greeting */
.greeting { text-align: center; }
.greeting p { margin: 0 0 18px; }
.parents { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; text-align: center; }
.parents b { display: block; font-size: 16px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
.parents span { font-size: 13.5px; }

/* Gallery */
.gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.gallery button { border: 0; padding: 0; background: none; display: block; }
.gallery .ph { aspect-ratio: 3 / 4; }
.more { display: block; margin: 20px auto 0; background: none; border: 1px solid var(--oat); color: var(--text); border-radius: 6px; padding: 8px 22px; font-size: 13.5px; }

/* Calendar */
.cal { text-align: center; }
.cal-month { font-size: 18px; font-weight: 600; color: var(--ink); margin: 0 0 20px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 10px; font-variant-numeric: tabular-nums; }
.cal-grid .dow { color: var(--mute); font-weight: 500; font-size: 14px; }
.cal-grid .dow.sun, .cal-grid .sun { color: #B98C80; }
.cal-grid .day { height: 46px; display: flex; flex-direction: column; align-items: center; font-size: 15px; }
.cal-grid .day span { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; }
.cal-grid .off { color: #D4CBC0; }
.cal-grid .wd span { background: var(--taupe); color: var(--paper); font-weight: 600; }
.cal-grid .wd small { font-size: 10.5px; font-weight: 600; color: var(--taupe); line-height: 1; margin-top: 2px; }
.dday { margin: 0 0 18px; }
.dday b { color: var(--ink); font-weight: 600; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--oat); background: var(--paper); color: var(--ink); border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 500; text-decoration: none; box-shadow: 0 1px 2px rgba(62,56,51,.06); }
.btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; }


/* Location */
.loc-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
.loc-head h3 { margin: 0; font-size: 16px; font-weight: 600; color: var(--ink); }
.btn.sm { padding: 7px 12px; font-size: 13px; }
.addr { margin: 0; }
.maps { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 20px; }
.maps .btn { justify-content: center; }
.route { margin-top: 36px; }
.route h3 { margin: 0 0 14px; font-size: 16px; font-weight: 600; color: var(--ink); }
.route dl { margin: 0; display: grid; grid-template-columns: 64px 1fr; row-gap: 14px; }
.route dt { font-weight: 600; color: var(--ink); }
.route dd { margin: 0; min-width: 0; }

/* Accounts */
.acc-sides { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; text-align: center; }
.acc-sides p { margin: 0 0 8px; font-size: 14px; }
.acc-sides b { color: var(--ink); font-weight: 600; }
.acc-sides .btn { width: 100%; justify-content: center; }
.acc-sides .btn[aria-expanded="true"] { background: var(--taupe); color: var(--paper); border-color: var(--taupe); }
.acc-list { margin-top: 16px; display: grid; gap: 8px; }
.acc { background: var(--paper); border: 1px solid var(--oat); border-radius: 10px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.acc div { min-width: 0; font-size: 14px; line-height: 1.55; }
.acc .who { color: var(--mute); font-size: 12.5px; }
.acc .num { color: var(--ink); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

/* RSVP popup + section */
.modal { position: fixed; inset: 0; background: rgba(46,41,37,.55); z-index: 15; display: grid; place-items: center; padding: 24px max(20px, env(safe-area-inset-right, 0px)) 24px max(20px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--linen); width: min(360px, 100%); border-radius: 14px; padding: 32px 24px 20px; text-align: center; box-shadow: 0 12px 40px rgba(46,41,37,.25); }
.sheet h3 { margin: 0 0 6px; font-size: 18px; font-weight: 600; color: var(--ink); }
.sheet p { margin: 0 0 20px; font-size: 14px; }
.sheet .info { background: var(--paper); border: 1px solid var(--oat); border-radius: 10px; padding: 12px; font-size: 13.5px; margin-bottom: 20px; line-height: 1.65; }
.sheet .info b { color: var(--ink); font-weight: 600; }
.btn.primary { background: var(--taupe); border-color: var(--taupe); color: var(--paper); width: 100%; justify-content: center; padding: 12px; }
.btn.primary:disabled { opacity: .5; cursor: default; }
.rsvp-form { display: grid; gap: 10px; text-align: left; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; border: 0; margin: 0; padding: 0; min-width: 0; }
.seg legend { font-size: 12.5px; color: var(--mute); margin-bottom: 4px; padding: 0; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; }
.seg span { display: block; text-align: center; padding: 9px 4px; border: 1px solid var(--oat); border-radius: 8px; background: var(--paper); font-size: 14px; color: var(--text); }
.seg input:checked + span { background: var(--taupe); border-color: var(--taupe); color: var(--paper); font-weight: 500; }
.seg input:focus-visible + span { outline: 2px solid var(--taupe); outline-offset: 2px; }
.field { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--paper); border: 1px solid var(--oat); border-radius: 8px; padding: 9px 12px; }
.field::placeholder { color: var(--mute); }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.form-msg { margin: 2px 0 0 !important; font-size: 13px; text-align: center; min-height: 1em; }
.form-msg.err { color: #A2574A; }
.thanks { padding: 12px 0 4px; }
.thanks b { display: block; font-size: 17px; color: var(--ink); font-weight: 600; margin-bottom: 6px; }
.sheet { max-height: calc(100vh - 48px); overflow-y: auto; }
.sheet-foot { display: flex; justify-content: space-between; margin-top: 14px; }
.link { background: none; border: 0; color: var(--mute); font-size: 13px; padding: 6px 2px; }
.rsvp { text-align: center; }
.rsvp p { margin: 0 0 20px; }
.rsvp .btn.primary { width: auto; padding: 12px 28px; }
.note { font-size: 12px; color: var(--mute); margin-top: 10px !important; }

/* Footer */
footer { text-align: center; padding-block: 48px 64px; font-size: 13px; color: var(--mute); }
footer .names { font-size: 15px; color: var(--ink); font-weight: 500; margin: 0 0 6px; }

/* Lightbox + toast */
.lb { position: fixed; inset: 0; background: rgba(30,27,24,.92); z-index: 20; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top, 0px)) 16px max(24px, env(safe-area-inset-bottom, 0px)); }
.lb .ph { width: min(420px, 100%); aspect-ratio: 2 / 3; max-height: 82vh; background: none; }
.lb .ph img { object-fit: contain; }
.lb-close { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); background: none; border: 0; color: #F1EBE2; font-size: 28px; line-height: 1; padding: 8px; }
.lb-nav { position: absolute; top: 50%; transform: translateY(-50%); background: none; border: 0; color: #F1EBE2; font-size: 30px; padding: 12px; }
.lb-prev { left: calc(4px + env(safe-area-inset-left, 0px)); } .lb-next { right: calc(4px + env(safe-area-inset-right, 0px)); }
.lb-count { position: absolute; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; text-align: center; color: #CFC5B8; font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--linen); font-size: 13.5px; padding: 9px 18px; border-radius: 99px; z-index: 30; white-space: nowrap; }

/* Motion: slow zoom on the cover, names drift in, sections rise on scroll, petals fall */
.cover .ph { overflow: hidden; }
#petals { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
/* Cover zoom runs for everyone; phones with reduced motion get a slower, smaller version */
.cover .ph img { animation: drift 14s ease-in-out infinite alternate; transform-origin: 55% 60%; }
@keyframes drift { from { transform: scale(1); } to { transform: scale(1.09) translateY(-1.5%); } }
@keyframes driftSoft { from { transform: scale(1); } to { transform: scale(1.04); } }
@media (prefers-reduced-motion: reduce) { .cover .ph img { animation: driftSoft 24s ease-in-out infinite alternate; } }
@media (prefers-reduced-motion: no-preference) {
  .cover-text > * { animation: appear 1.4s ease both; }
  .cover-text > *:nth-child(2) { animation-delay: .35s; }
  @keyframes appear { from { opacity: 0; transform: translateY(10px); letter-spacing: .14em; } to { opacity: 1; transform: none; } }
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity 1s ease, transform 1s ease; }
  .reveal.in { opacity: 1; transform: none; }
}
</style>

</head>
<body>
<main class="card" id="app"></main>
<div class="lb" id="lb" hidden role="dialog" aria-label="사진 크게 보기">
  <button class="lb-close" id="lbClose" aria-label="닫기">×</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="이전 사진">‹</button>
  <div class="ph" id="lbPh"></div>
  <button class="lb-nav lb-next" id="lbNext" aria-label="다음 사진">›</button>
  <div class="lb-count" id="lbCount"></div>
</div>
<div class="modal" id="rsvpModal" hidden role="dialog" aria-modal="true" aria-labelledby="rsvpTitle">
  <div class="sheet">
    <p class="eyebrow">R.S.V.P.</p>
    <h3 id="rsvpTitle">참석 여부를 알려주세요</h3>
    <p>원활한 식사 준비를 위해<br>참석 여부를 미리 여쭙고자 합니다.</p>
    <div id="rsvpBody">
      <form class="rsvp-form" id="rsvpForm" novalidate>
        <fieldset class="seg"><legend>어느 분의 하객이신가요?</legend>
          <label><input type="radio" name="side" value="신랑측" id="sideG"><span>신랑측</span></label>
          <label><input type="radio" name="side" value="신부측" id="sideB"><span>신부측</span></label>
        </fieldset>
        <fieldset class="seg"><legend>참석 여부</legend>
          <label><input type="radio" name="attend" value="참석" id="attY"><span>참석</span></label>
          <label><input type="radio" name="attend" value="불참" id="attN"><span>불참</span></label>
        </fieldset>
        <input class="field" id="rsvpName" name="name" placeholder="성함" maxlength="20" autocomplete="name">
        <div class="row-2" id="rsvpExtra">
          <select class="field" id="rsvpCount" name="count" aria-label="인원">
            <option value="1">본인 1명</option><option value="2">2명</option><option value="3">3명</option><option value="4">4명</option><option value="5">5명 이상</option>
          </select>
          <select class="field" id="rsvpMeal" name="meal" aria-label="식사">
            <option value="식사 예정">식사 예정</option><option value="식사 안 함">식사 안 함</option><option value="미정">미정</option>
          </select>
        </div>
        <button class="btn primary" type="submit" id="rsvpSubmit">참석 여부 전달하기</button>
        <p class="form-msg" id="rsvpOut" role="status"></p>
      </form>
    </div>
    <div class="sheet-foot"><button class="link" id="rsvpToday">오늘 하루 보지 않기</button><button class="link" id="rsvpClose">닫기</button></div>
  </div>
</div>
<canvas id="petals" aria-hidden="true"></canvas>
<div class="toast" id="toast" hidden></div>

<script>
/* ===== 여기 정보만 바꾸면 청첩장 전체가 바뀝니다 (현재는 샘플 값) ===== */
const DATA = {
  sample: false,
  groom: { name: "박봉경", father: "박종훈", mother: "황경순", rel: "아들" },
  bride: { name: "이아라", father: "이재욱", mother: "김마리아", rel: "딸" },
  date: "2026-12-26T12:30:00+09:00",
  venue: { name: "드레스가든", hall: "4층", address: "서울특별시 강남구 청담동 영동대로 707", mapQuery: "드레스가든 청담" },
  greeting: [
    ["한 해의 끝자락,", "서로의 온기가 되어줄 두 사람이", "하나의 가정을 이루어", "새 시작을 하려 합니다."],
    ["함께 자리하여 축복해 주시면", "더없는 기쁨으로 간직하겠습니다."]
  ],
  transport: [
    ["지하철", "7호선 청담역 13번 출구, 도보 2분"],
    ["버스", "청담역.경기고교 정류장 하차\n간선 143 · 146 · 345\n지선 2413 · 3217 · 4318\n직행좌석 9407 · 9507 · 9607"],
    ["주차", "주차가 혼잡할 수 있으니 대중교통 이용을 권해 드립니다.\nSUV·대형 세단은 주차가 어려울 수 있습니다."]
  ],
  rsvpEndpoint: "https://script.google.com/macros/s/AKfycbyqGmy0GMyYFO_TvQBXM6SewB9mu5QcIwK_IWl9jZdPFCz1sJT-JdAjnvwMMWRTFG2uRg/exec", // 구글 앱스 스크립트 웹 앱 URL (https://script.google.com/macros/s/.../exec)
  accounts: {
    groom: [ ["신랑", "박봉경", "", ""], ["아버지", "박종훈", "", ""], ["어머니", "황경순", "", ""] ],
    bride: [ ["신부", "이아라", "", ""], ["아버지", "이재욱", "", ""], ["어머니", "김마리아", "", ""] ]
  },
  photos: { cover: "img/main.jpg", gallery: ["img/g01.jpg", "img/g02.jpg", "img/g03.jpg", "img/g04.jpg", "img/g05.jpg", "img/g06.jpg", "img/g07.jpg", "img/g08.jpg", "img/main.jpg"] }
};
/* =================================================================== */

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ph = (src, label, cls = "") => `<div class="ph ${src ? "has-img" : ""} ${cls}" data-label="${esc(label)}">${src ? `<img src="${esc(src)}" alt="" ${cls.includes("eager") ? "" : 'loading="lazy"'}>` : ""}</div>`;
const ICON = {
  cal: '<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  copy: '<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
  pin: '<svg viewBox="0 0 24 24"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>',
  clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>'
};

const d = new Date(DATA.date);
const KST = new Date(d.getTime() + 9 * 3600e3); // 표시는 항상 한국 시간
const Y = KST.getUTCFullYear(), M = KST.getUTCMonth(), D = KST.getUTCDate(), W = KST.getUTCDay();
const H = KST.getUTCHours(), MI = KST.getUTCMinutes();
const DOW = ["일", "월", "화", "수", "목", "금", "토"];
const ampm = H < 12 ? "오전" : "오후", h12 = ((H + 11) % 12) + 1;
const timeKo = `${ampm} ${h12}시${MI ? ` ${MI}분` : ""}`;
const dateKo = `${Y}년 ${M + 1}월 ${D}일 ${DOW[W]}요일 ${timeKo}`;
const G = DATA.groom, B = DATA.bride, V = DATA.venue;

function calendarHTML() {
  const first = new Date(Date.UTC(Y, M, 1)).getUTCDay();
  const days = new Date(Date.UTC(Y, M + 1, 0)).getUTCDate();
  const prevDays = new Date(Date.UTC(Y, M, 0)).getUTCDate();
  let cells = DOW.map((x, i) => `<div class="dow ${i === 0 ? "sun" : ""}">${x}</div>`).join("");
  const total = Math.ceil((first + days) / 7) * 7;
  for (let i = 0; i < total; i++) {
    const n = i - first + 1, col = i % 7;
    if (n < 1) cells += `<div class="day off"><span>${prevDays + n}</span></div>`;
    else if (n > days) cells += `<div class="day off"><span>${n - days}</span></div>`;
    else cells += `<div class="day ${n === D ? "wd" : ""} ${col === 0 ? "sun" : ""}"><span>${n}</span>${n === D ? `<small>${H < 12 ? "AM" : "PM"} ${h12}:${String(MI).padStart(2, "0")}</small>` : ""}</div>`;
  }
  return cells;
}
function ddayText() {
  const now = new Date(Date.now() + 9 * 3600e3);
  const today = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
  const diff = Math.round((Date.UTC(Y, M, D) - today) / 864e5);
  if (diff > 0) return `${G.name}, ${B.name}의 결혼식이 <b>${diff}일</b> 남았습니다`;
  if (diff === 0) return `오늘, <b>결혼식 날</b>입니다`;
  return `<b>${-diff}일</b> 전, 두 사람이 부부가 되었습니다`;
}
function gcalLink() {
  const fmt = t => new Date(t).toISOString().replace(/[-:]|\.\d{3}/g, "");
  const p = new URLSearchParams({ action: "TEMPLATE", text: `${G.name} ♥ ${B.name} 결혼식`, dates: `${fmt(d)}/${fmt(d.getTime() + 2 * 3600e3)}`, location: `${V.name} ${V.hall}, ${V.address}` });
  return "https://calendar.google.com/calendar/render?" + p.toString();
}
function rsvpButton() { return `<button class="btn primary" id="rsvpOpen" type="button">참석 여부 전달하기</button>`; }
const accHTML = list => list.map(([role, name, bank, num]) => `
  <div class="acc"><div><div class="who">${esc(role)} ${esc(name)}</div><div class="num">${num ? esc(bank + " " + num) : '<span style="color:var(--mute)">계좌번호 준비 중</span>'}</div></div>
  ${num ? `<button class="btn sm" data-copy="${esc(bank + " " + num)}" data-msg="계좌번호를 복사했어요">${ICON.copy}복사</button>` : ""}</div>`).join("");

$("#app").innerHTML = `
<header class="cover">
  <div class="cover-text"><p class="eyebrow">The First Day of Us</p><h1 class="cover-names">${esc(G.name)} · ${esc(B.name)}</h1></div>
  ${ph(DATA.photos.cover, "메인 사진", "eager")}
  ${DATA.sample ? '<span class="sample">샘플 시안 · 실제 정보와 사진으로 바뀝니다</span>' : ""}
</header>

<dl class="facts pad">
  <div class="fact"><dt>일시</dt><dd>${dateKo}</dd></div>
  <div class="fact"><dt>장소</dt><dd>${esc(V.name)} ${esc(V.hall)}</dd></div>
</dl>

<section class="greeting pad">
  <p class="eyebrow">Invitation</p>
  ${DATA.greeting.map(lines => `<p>${lines.map(esc).join("<br>")}</p>`).join("")}
  <hr class="rule">
  <div class="parents">
    <div><b>${esc(G.name)}</b><span>${esc(G.father)} · ${esc(G.mother)}의 ${esc(G.rel)}</span></div>
    <div><b>${esc(B.name)}</b><span>${esc(B.father)} · ${esc(B.mother)}의 ${esc(B.rel)}</span></div>
  </div>
</section>

<div class="gallery" id="gallery"></div>
<button class="more" id="more" hidden>사진 더 보기</button>

<section class="cal pad">
  <p class="eyebrow">Wedding Day</p>
  <p class="cal-month">${Y}년 ${M + 1}월</p>
  <div class="cal-grid">${calendarHTML()}</div>
  <hr class="rule">
  <p class="dday">${ddayText()}</p>
  <a class="btn" href="${gcalLink()}" target="_blank" rel="noopener">${ICON.cal}내 캘린더에 저장하기</a>
</section>


<section class="pad">
  <p class="eyebrow">Location</p>
  <h2>오시는 길</h2>
  <div class="loc-head"><h3>${esc(V.name)}</h3><button class="btn sm" data-copy="${esc(V.address)}" data-msg="주소를 복사했어요">${ICON.copy}주소 복사</button></div>
  <p class="addr">${esc(V.address)}<br>${esc(V.hall)}</p>
  <div class="maps">
    <a class="btn" target="_blank" rel="noopener" href="https://map.naver.com/p/search/${encodeURIComponent(V.mapQuery || V.name)}">${ICON.pin}네이버 지도</a>
    <a class="btn" target="_blank" rel="noopener" href="https://map.kakao.com/link/search/${encodeURIComponent(V.mapQuery || V.name)}">${ICON.pin}카카오맵</a>
  </div>
  <div class="route"><dl>${DATA.transport.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v).replace(/\n/g, "<br>")}</dd>`).join("")}</dl></div>
</section>


<section class="pad">
  <p class="eyebrow">With Gratitude</p>
  <h2>마음 전하실 곳</h2>
  <div class="acc-sides">
    <div><p>신랑 <b>${esc(G.name)}</b> 측</p><button class="btn" data-side="groom" aria-expanded="false" id="accGroomBtn">계좌번호 보기</button></div>
    <div><p>신부 <b>${esc(B.name)}</b> 측</p><button class="btn" data-side="bride" aria-expanded="false" id="accBrideBtn">계좌번호 보기</button></div>
  </div>

  ${rsvpButton()}

<footer class="pad">

  ${Y}. ${String(M + 1).padStart(2, "0")}. ${String(D).padStart(2, "0")}. ${DOW[W]}요일 ${timeKo}
</footer>`;

/* Gallery: 9장 먼저, 나머지는 더 보기 */
const photos = DATA.photos.gallery;
let shown = Math.min(9, photos.length);
function renderGallery() {
  $("#gallery").innerHTML = photos.slice(0, shown).map((src, i) => `<button data-i="${i}" aria-label="사진 ${i + 1} 크게 보기">${ph(src, `사진 ${i + 1}`)}</button>`).join("");
  $("#more").hidden = shown >= photos.length;
}
renderGallery();
$("#more").onclick = () => { shown = photos.length; renderGallery(); };

let cur = 0;
function openLb(i) { cur = (i + photos.length) % photos.length; const box = $("#lbPh"); box.outerHTML = ph(photos[cur], `사진 ${cur + 1}`).replace('class="ph', 'id="lbPh" class="ph'); $("#lbCount").textContent = `${cur + 1} / ${photos.length}`; $("#lb").hidden = false; }
$("#gallery").addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (b) openLb(+b.dataset.i); });
$("#lbClose").onclick = () => { $("#lb").hidden = true; };
$("#lbPrev").onclick = () => openLb(cur - 1);
$("#lbNext").onclick = () => openLb(cur + 1);
$("#lb").addEventListener("click", e => { if (e.target.id === "lb") $("#lb").hidden = true; });
document.addEventListener("keydown", e => { if ($("#lb").hidden) return; if (e.key === "Escape") $("#lb").hidden = true; if (e.key === "ArrowLeft") openLb(cur - 1); if (e.key === "ArrowRight") openLb(cur + 1); });
let tx = 0;
$("#lb").addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
$("#lb").addEventListener("touchend", e => { const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) openLb(cur + (dx < 0 ? 1 : -1)); });

/* Accounts toggle */
let openSide = null;
document.querySelectorAll("[data-side]").forEach(btn => btn.addEventListener("click", () => {
  const side = btn.dataset.side;
  openSide = openSide === side ? null : side;
  document.querySelectorAll("[data-side]").forEach(b => b.setAttribute("aria-expanded", String(b.dataset.side === openSide)));
  $("#accList").hidden = !openSide;
  if (openSide) $("#accList").innerHTML = accHTML(DATA.accounts[openSide]);
}));

/* RSVP popup */
const modal = $("#rsvpModal");
const store = { get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} } };
const todayKey = "rsvp-hide-" + new Date().toDateString();
function showThanks() {
  $("#rsvpBody").innerHTML = `<div class="thanks"><b>전달되었습니다</b>소중한 마음 감사드립니다.<br>${dateKo}에 뵙겠습니다.</div>`;
  $("#rsvpToday").hidden = true;
}
if (store.get("rsvp-done") === "1") showThanks();
if (store.get("rsvp-done") !== "1" && store.get(todayKey) !== "1") setTimeout(() => { modal.hidden = false; }, 600);
$("#rsvpOpen").onclick = () => { modal.hidden = false; };
$("#rsvpClose").onclick = () => { modal.hidden = true; };
$("#rsvpToday").onclick = () => { store.set(todayKey, "1"); modal.hidden = true; };
modal.addEventListener("click", e => { if (e.target === modal) modal.hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") modal.hidden = true; });

const form = $("#rsvpForm");
form.addEventListener("change", () => { $("#rsvpExtra").hidden = form.attend.value === "불참"; });
form.addEventListener("submit", async e => {
  e.preventDefault();
  const out = $("#rsvpOut"); out.className = "form-msg err";
  const side = form.side.value, attend = form.attend.value, name = form.name.value.trim();
  if (!side) { out.textContent = "신랑측·신부측을 골라주세요."; return; }
  if (!attend) { out.textContent = "참석 여부를 골라주세요."; return; }
  if (!name) { out.textContent = "성함을 적어주세요."; form.name.focus(); return; }
  if (!DATA.rsvpEndpoint) { out.textContent = "아직 응답 저장소가 연결되지 않았어요."; return; }
  const btn = $("#rsvpSubmit"); btn.disabled = true; btn.textContent = "전달하는 중…"; out.textContent = "";
  const body = { name, side, attend, count: attend === "참석" ? form.count.value : "0", meal: attend === "참석" ? form.meal.value : "-" };
  try {
    const res = await fetch(DATA.rsvpEndpoint, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "save failed");
    store.set("rsvp-done", "1");
    showThanks();
  } catch (_) {
    out.textContent = "전달하지 못했어요. 인터넷 연결을 확인하고 다시 눌러주세요.";
    btn.disabled = false; btn.textContent = "참석 여부 전달하기";
  }
});

/* Scroll reveal: only things below the first screen wait to rise */
const motionOK = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if (motionOK && "IntersectionObserver" in window) {
  const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } }), { rootMargin: "0px 0px -8% 0px" });
  document.querySelectorAll("#app > section, #app > .facts, #app > footer, .gallery > button").forEach((el, i) => {
    if (el.getBoundingClientRect().top < innerHeight) return;
    el.classList.add("reveal");
    if (el.parentElement.classList.contains("gallery")) el.style.transitionDelay = (i % 3) * 0.12 + "s";
    io.observe(el);
  });
}

/* Falling petals */
(function petals() {
  const cv = $("#petals"); if (!cv.getContext) { cv.hidden = true; return; }
  const soft = !motionOK; // reduced-motion phones: fewer, slower petals
  const ctx = cv.getContext("2d");
  const COLORS = ["#F4DDD6", "#EFD3C8", "#FBEFEA", "#F7E6DC", "#FFFFFF"];
  let W, H, dpr, list = [], running = true, last = 0;
  function size() { dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  const N = () => Math.round(Math.min(26, Math.max(14, W / 22)) * (soft ? .5 : 1));
  function make(top) {
    return { x: Math.random() * W, y: top ? -20 - Math.random() * H * 0.3 : Math.random() * H,
      r: 5 + Math.random() * 6, vy: (18 + Math.random() * 22) * (soft ? .6 : 1), sway: 14 + Math.random() * 26, ph: Math.random() * 6.28,
      rot: Math.random() * 6.28, vr: (Math.random() - .5) * (soft ? .6 : 1.4), flip: Math.random() * 6.28,
      c: COLORS[(Math.random() * COLORS.length) | 0], a: .55 + Math.random() * .35 };
  }
  function petal(p) {
    ctx.save(); ctx.translate(p.x + Math.sin(p.ph) * p.sway, p.y); ctx.rotate(p.rot);
    ctx.scale(1, Math.abs(Math.cos(p.flip)) * .7 + .3);
    ctx.globalAlpha = p.a; ctx.fillStyle = p.c;
    ctx.shadowColor = "rgba(150,110,95,.18)"; ctx.shadowBlur = 3;
    ctx.beginPath(); ctx.moveTo(0, -p.r);
    ctx.bezierCurveTo(p.r * .9, -p.r * .6, p.r * .7, p.r * .7, 0, p.r);
    ctx.bezierCurveTo(-p.r * .7, p.r * .7, -p.r * .9, -p.r * .6, 0, -p.r);
    ctx.fill(); ctx.restore();
  }
  function frame(t) {
    if (!running) return;
    const dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
    ctx.clearRect(0, 0, W, H);
    for (const p of list) {
      p.y += p.vy * dt; p.ph += dt * .9; p.rot += p.vr * dt; p.flip += dt * 1.6;
      if (p.y > H + 20) Object.assign(p, make(true));
      petal(p);
    }
    requestAnimationFrame(frame);
  }
  size(); list = Array.from({ length: N() }, () => make(false));
  addEventListener("resize", () => { size(); while (list.length < N()) list.push(make(true)); list.length = N(); });
  document.addEventListener("visibilitychange", () => { running = !document.hidden; if (running) { last = performance.now(); requestAnimationFrame(frame); } });
  requestAnimationFrame(frame);
})();

/* Copy + toast */
let tt;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 1800); }
document.addEventListener("click", e => {
  const b = e.target.closest("[data-copy]"); if (!b) return;
  const text = b.dataset.copy;
  const fallback = () => { const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (_) {} ta.remove(); toast(ok ? b.dataset.msg : text); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast(b.dataset.msg), fallback); else fallback();
});
</script>
